name: 'Pull Request Feedback'

on: 
  pull_request:

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Setup python
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r requirements.txt
      
      - run: pip install -r requirements-runners.txt
      - run: pip install -r requirements-test.txt

      - name: Run tests and get output
        run: pytest

  radiator-test:
    name: Run the Information Radiator's tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radiator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Setup python
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install requirements
        run: pip install -r radiator/requirements-test.txt

      - name: Check the migrations match the models
        env:
          RADIATOR_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/radiator_test
        run: |
          alembic -c radiator/alembic.ini upgrade head
          alembic -c radiator/alembic.ini check

      - name: Run tests
        env:
          RADIATOR_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/radiator_test
        run: pytest radiator/tests

  check-format:
    name: Check that code matches Black formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: psf/black@stable
