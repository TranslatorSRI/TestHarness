# One-off Job: import past runs from Zebrunner into the Information Radiator.
# Run it once the radiator is up; it's safe to re-run (already-imported runs
# are skipped). Try `--dry-run` and `--limit 5` first to check what comes
# across.
#
# Zebrunner never recorded the environment. Pass --env for the environment
# these runs were against; to import runs from several environments, run the
# Job once per environment with --since/--until/--suite narrowing each.
apiVersion: batch/v1
kind: Job
metadata:
  name: radiator-zebrunner-import
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: ghcr.io/translatorsri/testharness-radiator:latest
          command: ["python", "-m", "radiator.zebrunner_import"]
          args:
            - --zebrunner-url=$(ZE_BASE_URL)
            - --refresh-token=$(ZE_REFRESH_TOKEN)
            - --radiator-url=http://radiator
            - --radiator-token=$(RADIATOR_TOKEN)
            - --env=ci
          env:
            - name: ZE_BASE_URL
              valueFrom: {secretKeyRef: {name: test-harness-secrets, key: ze-base-url}}
            - name: ZE_REFRESH_TOKEN
              valueFrom: {secretKeyRef: {name: test-harness-secrets, key: ze-refresh-token}}
            - name: RADIATOR_TOKEN
              valueFrom: {secretKeyRef: {name: radiator-secrets, key: api-token}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
