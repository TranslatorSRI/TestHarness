{{- $s := .Values.secrets }}
{{- $url := $s.databaseUrl }}
{{- if and (not $url) .Values.postgres.enabled }}
{{- $pw := required "postgres.password is needed to build the database URL (or set secrets.databaseUrl)" .Values.postgres.password }}
{{- $url = printf "postgresql+psycopg://radiator:%s@%s:5432/radiator" ($pw | urlquery) (include "radiator.postgresName" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "radiator.secretName" . }}
  labels: {{- include "radiator.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required (or enable postgres)" $url | quote }}
  api-token: {{ required "secrets.apiToken is required" $s.apiToken | quote }}
  username: {{ required "secrets.username is required" $s.username | quote }}
  password: {{ required "secrets.password is required" $s.password | quote }}
  session-secret: {{ required "secrets.sessionSecret is required" $s.sessionSecret | quote }}
  {{- with .Values.zebrunnerImport }}
  {{- if .enabled }}
  ze-base-url: {{ required "zebrunnerImport.baseUrl is required" .baseUrl | quote }}
  ze-refresh-token: {{ required "zebrunnerImport.refreshToken is required" .refreshToken | quote }}
  {{- end }}
  {{- end }}
