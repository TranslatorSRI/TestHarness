{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
{{- $url := $s.databaseUrl }}
{{- if and (not $url) .Values.postgres.enabled }}
{{- $pw := required "postgres.password is needed to build the database URL (or set secrets.databaseUrl, or use existingSecret)" .Values.postgres.password }}
{{- $url = printf "postgresql+psycopg://radiator:%s@%s:5432/radiator" ($pw | urlquery) (include "radiator.postgresName" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "radiator.secretName" . }}
  labels: {{- include "radiator.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required (or enable postgres, or use existingSecret)" $url | quote }}
  api-token: {{ required "secrets.apiToken is required (or use existingSecret)" $s.apiToken | quote }}
  username: {{ required "secrets.username is required (or use existingSecret)" $s.username | quote }}
  password: {{ required "secrets.password is required (or use existingSecret)" $s.password | quote }}
  session-secret: {{ required "secrets.sessionSecret is required (or use existingSecret)" $s.sessionSecret | quote }}
{{- end }}
