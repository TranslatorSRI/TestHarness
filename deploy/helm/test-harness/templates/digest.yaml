{{- if .Values.digest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "harness.fullname" . }}-weekly-digest
  labels:
    {{- include "harness.labels" . | nindent 4 }}
    app.kubernetes.io/component: digest
spec:
  schedule: {{ .Values.digest.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.digest.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # it only reads from the radiator, so one retry is harmless
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: digest
        spec:
          {{- $container := include "harness.digestContainer" . }}
          {{- include "harness.podSpec" (dict "root" . "container" $container) | nindent 10 }}
{{- end }}

{{- define "harness.digestContainer" -}}
- name: digest
  image: {{ include "harness.image" . }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  command: ["test-harness-radiator", "digest", "--days", {{ .Values.digest.days | quote }}]
  env:
    {{- include "harness.env" . | nindent 4 }}
  resources: {{- toYaml .Values.digest.resources | nindent 4 }}
{{- end -}}
