{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "harness.secretName" . }}
  labels: {{- include "harness.labels" . | nindent 4 }}
type: Opaque
stringData:
  radiator-token: {{ required "secrets.radiatorToken is required" $s.radiatorToken | quote }}
  {{- range $key, $value := dict "slack-webhook-url" $s.slackWebhookUrl "slack-token" $s.slackToken "slack-channel" $s.slackChannel }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
