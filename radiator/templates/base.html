<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Information Radiator{% endblock %} · Translator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230ca30c'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Information Radiator</span></a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if nav == 'runs' }}">Runs</a>
      <a href="/trends" class="{{ 'active' if nav == 'trends' }}">Trends</a>
      <a href="/performance" class="{{ 'active' if nav == 'performance' }}">Performance</a>
    </nav>
    <form class="logout" method="post" action="/logout"><button type="submit">Log out</button></form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='charts.js') }}" defer></script>
</body>
</html>
